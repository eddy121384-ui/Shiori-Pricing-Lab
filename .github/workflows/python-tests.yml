name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[quant]"

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest

  windows-launcher-smoke:
    # Issue #138: exercises the real start_shiori.bat entry point on a real
    # Windows runner -- the launcher must never be "proven" only by its
    # Python unit tests, since those never invoke the .bat file itself.
    # PowerShell/pwsh is used below only to prepare the smoke-test
    # environment (copying the checkout into a path with spaces, Unicode,
    # and parentheses) -- that is CI plumbing, not something the launcher
    # itself ever requires. start_shiori.bat is invoked the same way a
    # double-click would run it: via cmd.exe, with no PowerShell, no
    # execution-policy change, and no administrator rights.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Copy checkout into a path with spaces, Unicode, and parentheses
        shell: pwsh
        run: |
          $dest = "C:\Shiori Smoke Test (税) Folder\Shiori Pricing Lab"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination $dest -Recurse -Force
          "SMOKE_TEST_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run start_shiori.bat --no-browser (the real launcher entry point)
        shell: cmd
        run: |
          cd /d "%SMOKE_TEST_DIR%"
          call start_shiori.bat --no-browser
