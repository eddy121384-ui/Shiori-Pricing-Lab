name: Codex to OpenCode relay

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: shiori-opencode-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  relay:
    if: >-
      github.event.review.user.id == 199175422 &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Collect current-HEAD review state
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MAX_AUTO_CORRECTIONS: "3"
        run: |
          set -euo pipefail

          state_dir="$RUNNER_TEMP/codex-relay"
          mkdir -p "$state_dir"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID" > "$state_dir/review.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments" --slurp > "$state_dir/review-comments.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --slurp > "$state_dir/pr-comments.json"

          review_commit="$(jq -r '.commit_id // ""' "$state_dir/review.json")"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current_head" != "$EVENT_HEAD_SHA" ] || { [ -n "$review_commit" ] && [ "$review_commit" != "$EVENT_HEAD_SHA" ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale Codex review."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          state_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "codex-relay"
          review = json.loads((state_dir / "review.json").read_text())
          review_pages = json.loads((state_dir / "review-comments.json").read_text())
          pr_pages = json.loads((state_dir / "pr-comments.json").read_text())

          review_comments = [item for page in review_pages for item in page]
          pr_comments = [item for page in pr_pages for item in page]

          material = re.compile(
              r"P[012]\s+Badge|(?:^|\n)\s*(?:[-*]\s*)?(?:\*\*)?\[?P[012]\]?(?:\*\*)?\s*(?:[-—:])",
              re.IGNORECASE,
          )
          escalate = re.compile(r"(?im)^\s*ESCALATE\s*$")

          bodies = [review.get("body") or ""] + [c.get("body") or "" for c in review_comments]
          findings = [body.strip() for body in bodies if body.strip() and material.search(body)]
          needs_escalation = any(escalate.search(body) for body in bodies)

          trusted_state_comments = [
              c for c in pr_comments
              if (c.get("user") or {}).get("login") == "github-actions[bot]"
          ]
          marker = f"<!-- codex-opencode-relay:review={os.environ['REVIEW_ID']}"
          duplicate = any(marker in (c.get("body") or "") for c in trusted_state_comments)
          completed_rounds = sum(
              1
              for c in trusted_state_comments
              if "<!-- codex-opencode-relay:" in (c.get("body") or "")
              and "status=completed" in (c.get("body") or "")
          )

          (state_dir / "findings.txt").write_text(
              "\n\n---\n\n".join(findings),
              encoding="utf-8",
          )
          (state_dir / "relay.env").write_text(
              "\n".join(
                  [
                      f"duplicate={int(duplicate)}",
                      f"escalate={int(needs_escalation)}",
                      f"completed_rounds={completed_rounds}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          PY

          . "$RUNNER_TEMP/codex-relay/relay.env"

          if [ "$duplicate" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Review $REVIEW_ID was already handled."
            exit 0
          fi

          if [ "$escalate" -gt 0 ]; then
            marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=stopped -->"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$marker
          Codex emitted ESCALATE. STOP — Eddy/Sophira review required." >/dev/null
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -s "$RUNNER_TEMP/codex-relay/findings.txt" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No P0/P1/P2 findings in submitted Codex review."
            exit 0
          fi

          if [ "$completed_rounds" -ge "$MAX_AUTO_CORRECTIONS" ]; then
            marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=stopped -->"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$marker
          Automatic correction limit reached ($MAX_AUTO_CORRECTIONS completed rounds). STOP — Eddy/Sophira review required." >/dev/null
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "round=$((completed_rounds + 1))" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact reviewed HEAD
        if: steps.collect.outputs.run == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.collect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare verified PR branch
        if: steps.collect.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ steps.collect.outputs.head_ref }}
          HEAD_SHA: ${{ steps.collect.outputs.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          test "$current_sha" = "$HEAD_SHA"
          test "$current_ref" = "$HEAD_REF"
          git fetch origin "$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse "refs/remotes/origin/$HEAD_REF")" = "$HEAD_SHA"
          git switch -C "$HEAD_REF" "$HEAD_SHA"
          git branch --set-upstream-to="origin/$HEAD_REF" "$HEAD_REF"
          git remote set-url --push origin DISABLED_BY_SHIORI_WORKFLOW

      - name: Install pinned OpenCode CLI
        if: steps.collect.outputs.run == 'true'
        env:
          OPENCODE_VERSION: v1.18.33
          OPENCODE_SHA256: e546123213ae47909a4268692aa4b94950d011afe9cac9938753a2194f1c16d5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          bindir="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bindir"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/$OPENCODE_VERSION/opencode-linux-x64.tar.gz" -o "$archive"
          echo "$OPENCODE_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bindir"
          test -x "$bindir/opencode"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Run OpenCode correction
        if: steps.collect.outputs.run == 'true'
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_AUTOMATION_MODEL }}
          OPENCODE_VARIANT: ${{ vars.OPENCODE_AUTOMATION_VARIANT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENCODE_AUTOMATION_API_KEY }}
          OPENCODE_CONFIG_CONTENT: '{"formatter":false,"permission":{"*":"deny","read":"allow","edit":"allow","glob":"allow","grep":"allow"},"provider":{"openrouter":{"options":{"apiKey":"{env:OPENROUTER_API_KEY}"}}}}'
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          EXPECTED_HEAD: ${{ steps.collect.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -n "$OPENCODE_MODEL" || {
            echo "Set repository Actions variable OPENCODE_AUTOMATION_MODEL."
            exit 1
          }
          test -n "$OPENROUTER_API_KEY" || {
            echo "Set dedicated repository secret OPENCODE_AUTOMATION_API_KEY."
            exit 1
          }
          case "$OPENCODE_MODEL" in
            openrouter/*) ;;
            *) echo "OPENCODE_AUTOMATION_MODEL must use the openrouter/* provider."; exit 1 ;;
          esac

          cat > "$RUNNER_TEMP/opencode-prompt.txt" <<EOF
          Automated Codex correction for existing PR #$PR_NUMBER at expected HEAD $EXPECTED_HEAD.

          Follow AGENTS.md. Address all valid P0/P1/P2 findings below as one batch. Continue autonomously through ordinary engineering choices. Do not expand scope.

          Security boundary: you may read/search/edit repository files only. Do not run validation, shell commands, network tools, subagents, formatters, or external-directory tools; those capabilities are hard-disabled by the workflow. Validation occurs separately without model credentials.

          The workflow owns commit and push. Modify the working tree only; do NOT commit or push.

          If a new RED methodology/pricing/canonical-schema/validation/fallback decision is required, do not modify files and stop with a clear RED report.

          Codex findings:
          EOF
          cat "$RUNNER_TEMP/codex-relay/findings.txt" >> "$RUNNER_TEMP/opencode-prompt.txt"

          args=(run --auto --model "$OPENCODE_MODEL")
          if [ -n "${OPENCODE_VARIANT:-}" ]; then
            args+=(--variant "$OPENCODE_VARIANT")
          fi
          opencode --pure "${args[@]}" < "$RUNNER_TEMP/opencode-prompt.txt"

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || {
            echo "OpenCode committed locally even though the workflow owns commit/push. STOP."
            exit 1
          }

      - name: Validate correction before publication
        if: steps.collect.outputs.run == 'true'
        env:
          EXPECTED_HEAD: ${{ steps.collect.outputs.head_sha }}
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail

          changed="$(
            {
              git diff --name-only "$EXPECTED_HEAD" --
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          if [ -z "$changed" ]; then
            echo "No repository changes to validate."
            exit 0
          fi

          printf '%s\n' "$changed"

          needs_python=false
          needs_actionlint=false
          unsupported=""

          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*)
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                needs_actionlint=true
                ;;
              *.py|*.html|*.css|*.js|*.ts|*.tsx|*.json|*.toml|requirements.txt|pyproject.toml|src/*|tests/*)
                needs_python=true
                ;;
              *)
                unsupported="${unsupported}${unsupported:+$'\n'}$path"
                ;;
            esac
          done <<< "$changed"

          if [ -n "$unsupported" ]; then
            echo "No trusted pre-publication validator is configured for:"
            printf '%s\n' "$unsupported"
            echo "STOP — Eddy/Sophira review required before publication."
            exit 1
          fi

          if [ "$needs_actionlint" = true ]; then
            archive="$RUNNER_TEMP/actionlint.tar.gz"
            bindir="$RUNNER_TEMP/actionlint-bin"
            mkdir -p "$bindir"
            curl -fsSL "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/actionlint_1.7.12_linux_amd64.tar.gz" -o "$archive"
            echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$bindir"
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
              | xargs -0 -r "$bindir/actionlint"
          fi

          if [ "$needs_python" = true ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install -e ".[quant]"
            playwright install --with-deps chromium
            pytest
          fi

      - name: Publish exact correction commit
        id: publish
        if: steps.collect.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          HEAD_REF: ${{ steps.collect.outputs.head_ref }}
          EXPECTED_HEAD: ${{ steps.collect.outputs.head_sha }}
          ROUND: ${{ steps.collect.outputs.round }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=stopped -->"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$marker
          OpenCode produced no repository changes for material findings. STOP — Eddy/Sophira review required." >/dev/null
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          test "$current_sha" = "$EXPECTED_HEAD"
          test "$current_ref" = "$HEAD_REF"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated Codex correction for PR #$PR_NUMBER"
          new_head="$(git rev-parse HEAD)"

          git remote set-url --push origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "HEAD:$HEAD_REF"

          remote_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$remote_head" = "$new_head"

          marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=completed from=$EXPECTED_HEAD to=$new_head -->"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="$marker
          Automatic OpenCode correction round $ROUND/3 completed. HEAD advanced from $EXPECTED_HEAD to $new_head." >/dev/null

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Request fresh Codex review
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="@codex review" >/dev/null
