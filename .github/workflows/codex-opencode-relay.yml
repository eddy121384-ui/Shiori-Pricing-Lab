name: Codex to OpenCode relay

on:
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: ${{ github.event.review.user.id == 199175422 && github.event.pull_request.author_association == 'OWNER' && github.event.pull_request.head.repo.full_name == github.repository && format('shiori-opencode-pr-{0}', github.event.pull_request.number) || format('shiori-opencode-review-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event.review.user.id == 199175422 &&
      github.event.pull_request.author_association == 'OWNER' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.collect.outputs.run }}
      stop: ${{ steps.collect.outputs.stop }}
      stop_reason: ${{ steps.collect.outputs.stop_reason }}
      head_ref: ${{ steps.collect.outputs.head_ref }}
      head_sha: ${{ steps.collect.outputs.head_sha }}
      review_id: ${{ steps.collect.outputs.review_id }}
      round: ${{ steps.collect.outputs.round }}

    steps:
      - name: Collect current-head material review
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MAX_AUTO_CORRECTIONS: '3'
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/relay"
          mkdir -p "$state"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID" > "$state/review.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments" --slurp > "$state/review-comments.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --slurp > "$state/pr-comments.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --slurp > "$state/pr-files.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --slurp > "$state/pr-commits.json"

          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          review_commit="$(jq -r '.commit_id // ""' "$state/review.json")"
          if [ "$current_head" != "$EVENT_HEAD_SHA" ] || { [ -n "$review_commit" ] && [ "$review_commit" != "$EVENT_HEAD_SHA" ]; }; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          state = pathlib.Path(os.environ['RUNNER_TEMP']) / 'relay'
          review = json.loads((state / 'review.json').read_text())
          pages = json.loads((state / 'review-comments.json').read_text())
          pr_pages = json.loads((state / 'pr-comments.json').read_text())
          file_pages = json.loads((state / 'pr-files.json').read_text())
          commit_pages = json.loads((state / 'pr-commits.json').read_text())
          review_comments = [x for page in pages for x in page]
          pr_comments = [x for page in pr_pages for x in page]
          pr_files = [x['filename'] for page in file_pages for x in page]
          pr_commits = [x for page in commit_pages for x in page]

          protected_exact = {
              'AGENTS.md', 'CLAUDE.md', 'docs/12_pr_review_rubric.md',
              'opencode.json', 'opencode.jsonc', 'requirements.txt', 'pyproject.toml',
          }
          protected = [
              path for path in pr_files
              if path in protected_exact or path.startswith(('.github/', '.claude/', '.opencode/'))
          ]

          material = re.compile(r"P[012]\s+Badge|(?:^|\n)\s*(?:[-*]\s*)?(?:\*\*)?\[?P[012]\]?(?:\*\*)?\s*(?:[-—:])", re.I)
          escalate = re.compile(r"(?im)^\s*ESCALATE\s*$")
          bodies = [review.get('body') or ''] + [c.get('body') or '' for c in review_comments]
          findings = [b.strip() for b in bodies if b.strip() and material.search(b)]

          trusted = [c for c in pr_comments if (c.get('user') or {}).get('login') == 'github-actions[bot]']
          review_id = os.environ['REVIEW_ID']

          automated_review_ids = []
          for item in pr_commits:
              message = ((item.get('commit') or {}).get('message') or '')
              lines = {line.strip() for line in message.splitlines()}
              if 'Shiori-Automation: opencode-codex-relay' not in lines:
                  continue
              for line in lines:
                  if line.startswith('Codex-Review-ID: '):
                      automated_review_ids.append(line.removeprefix('Codex-Review-ID: ').strip())
                      break

          stopped_duplicate = any(
              f'<!-- codex-opencode-relay:review={review_id}' in (c.get('body') or '')
              and 'status=stopped' in (c.get('body') or '')
              for c in trusted
          )
          duplicate = stopped_duplicate or review_id in automated_review_ids
          completed = len(automated_review_ids)
          needs_escalation = any(escalate.search(b) for b in bodies)

          prompt = (
              f"Automated Codex correction for PR #{os.environ['PR_NUMBER']} at reviewed HEAD {os.environ['EVENT_HEAD_SHA']}.\n\n"
              "Follow AGENTS.md. Address all valid P0/P1/P2 findings below as one batch. "
              "Make ordinary engineering decisions autonomously. Do not expand scope. "
              "Read/search/edit repository files only; do not run validation or commit/push. "
              "Do not edit repository control-plane files (.github/**, AGENTS.md, CLAUDE.md, "
              "docs/12_pr_review_rubric.md, .claude/**, opencode.json/jsonc, .opencode/**, "
              "requirements.txt, or pyproject.toml). "
              "If a new RED methodology/pricing/canonical-schema/validation/fallback decision is required, make no changes.\n\n"
              "Codex findings:\n" + "\n\n---\n\n".join(findings)
          )
          (state / 'prompt.txt').write_text(prompt, encoding='utf-8')
          (state / 'meta.env').write_text(
              f"duplicate={int(duplicate)}\n"
              f"escalate={int(needs_escalation)}\n"
              f"completed={completed}\n"
              f"has_findings={int(bool(findings))}\n"
              f"protected={int(bool(protected))}\n",
              encoding='utf-8',
          )
          PY

          . "$state/meta.env"
          if [ "$protected" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'stop=true' >> "$GITHUB_OUTPUT"
            echo 'stop_reason=PR modifies automation/governance control-plane files.' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$duplicate" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$escalate" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'stop=true' >> "$GITHUB_OUTPUT"
            echo 'stop_reason=Codex emitted ESCALATE.' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$has_findings" -eq 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$completed" -ge "$MAX_AUTO_CORRECTIONS" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'stop=true' >> "$GITHUB_OUTPUT"
            echo 'stop_reason=Automatic correction limit reached.' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo 'stop=false' >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "round=$((completed + 1))" >> "$GITHUB_OUTPUT"

      - name: Upload immutable prompt
        if: steps.collect.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-prompt-${{ github.run_id }}
          path: ${{ runner.temp }}/relay/prompt.txt
          if-no-files-found: error
          retention-days: 1

  report-stop:
    needs: collect
    if: needs.collect.outputs.stop == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report stop gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          STOP_REASON: ${{ needs.collect.outputs.stop_reason }}
        run: |
          marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=stopped -->"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --raw-field body="$marker
          $STOP_REASON STOP — Eddy/Sophira review required." >/dev/null

  agent:
    needs: collect
    if: needs.collect.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      patch_sha: ${{ steps.patch.outputs.patch_sha }}
      changed: ${{ steps.patch.outputs.changed }}

    steps:
      - name: Reconfirm reviewed PR head before model execution
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ needs.collect.outputs.head_sha }}
          EXPECTED_REF: ${{ needs.collect.outputs.head_ref }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.head.sha' <<<"$meta")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.ref' <<<"$meta")" = "$EXPECTED_REF"
          test "$(jq -r '.head.repo.full_name' <<<"$meta")" = "$GITHUB_REPOSITORY"

      - name: Checkout exact reviewed head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.collect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable prompt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: codex-prompt-${{ github.run_id }}
          path: ${{ runner.temp }}/prompt

      - name: Install pinned OpenCode CLI
        env:
          OPENCODE_VERSION: v1.18.33
          OPENCODE_SHA256: e546123213ae47909a4268692aa4b94950d011afe9cac9938753a2194f1c16d5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          bindir="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bindir"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/$OPENCODE_VERSION/opencode-linux-x64.tar.gz" -o "$archive"
          echo "$OPENCODE_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bindir"
          test -x "$bindir/opencode"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Quarantine PR-controlled OpenCode config
        run: |
          set -euo pipefail
          q="$RUNNER_TEMP/opencode-quarantine"
          mkdir -p "$q"
          for path in opencode.json opencode.jsonc .opencode; do
            if [ -e "$path" ]; then
              mv "$path" "$q/$path"
            fi
          done

      - name: Reconfirm head and reject symlink or gitlink before model
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ needs.collect.outputs.head_sha }}
          EXPECTED_REF: ${{ needs.collect.outputs.head_ref }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.head.sha' <<<"$meta")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.ref' <<<"$meta")" = "$EXPECTED_REF"
          test "$(jq -r '.head.repo.full_name' <<<"$meta")" = "$GITHUB_REPOSITORY"
          if git ls-files -s | awk '$1 == "120000" || $1 == "160000" { bad=1 } END { exit bad ? 0 : 1 }'; then
            echo 'Tracked symlink/gitlink present; automation fails closed.'
            exit 1
          fi

      - name: Run read-edit-only OpenCode
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_AUTOMATION_MODEL }}
          OPENCODE_VARIANT: ${{ vars.OPENCODE_AUTOMATION_VARIANT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENCODE_AUTOMATION_API_KEY }}
          OPENCODE_CONFIG_CONTENT: '{"formatter":false,"lsp":false,"plugin":[],"permission":{"*":"deny","read":{"*":"allow",".git/*":"deny","*.env":"deny","*.env.*":"deny"},"edit":{"*":"allow",".git/*":"deny"},"glob":"allow","grep":"allow"},"agent":{"build":{"permission":{"*":"deny","read":{"*":"allow",".git/*":"deny","*.env":"deny","*.env.*":"deny"},"edit":{"*":"allow",".git/*":"deny"},"glob":"allow","grep":"allow"}}}}'
          OPENCODE_DISABLE_AUTOUPDATE: 'true'
          OPENCODE_DISABLE_DEFAULT_PLUGINS: 'true'
          OPENCODE_DISABLE_EXTERNAL_SKILLS: '1'
          OPENCODE_DISABLE_LSP_DOWNLOAD: 'true'
          OPENCODE_DISABLE_CLAUDE_CODE: '1'
          OPENCODE_PURE: '1'
          EXPECTED_HEAD: ${{ needs.collect.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$OPENCODE_MODEL"
          test -n "$OPENROUTER_API_KEY"
          case "$OPENCODE_MODEL" in
            openrouter/*) ;;
            *) echo 'OPENCODE_AUTOMATION_MODEL must use openrouter/*.'; exit 1 ;;
          esac
          args=(run --auto --agent build --model "$OPENCODE_MODEL")
          if [ -n "${OPENCODE_VARIANT:-}" ]; then args+=(--variant "$OPENCODE_VARIANT"); fi
          opencode --pure "${args[@]}" < "$RUNNER_TEMP/prompt/prompt.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Restore quarantined OpenCode config
        if: always()
        run: |
          set -euo pipefail
          q="$RUNNER_TEMP/opencode-quarantine"
          collision=false
          for path in opencode.json opencode.jsonc .opencode; do
            if [ -e "$q/$path" ]; then
              if [ -e "$path" ]; then
                rm -rf "$path"
                collision=true
              fi
              mv "$q/$path" "$path"
            fi
          done
          if [ "$collision" = true ]; then
            echo 'OpenCode attempted to create project-level OpenCode config while trusted config was quarantined.'
            exit 1
          fi

      - name: Build immutable patch
        id: patch
        run: |
          set -euo pipefail
          git add -A
          patch="$RUNNER_TEMP/change.patch"
          git diff --cached --binary --full-index --no-ext-diff > "$patch"
          if [ ! -s "$patch" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "patch_sha=$(sha256sum "$patch" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload immutable patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/change.patch
          if-no-files-found: error
          retention-days: 1

  report-agent-failure:
    needs: [collect, agent]
    if: always() && needs.collect.outputs.run == 'true' && needs.agent.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report agent failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ needs.collect.outputs.review_id }}
        run: |
          marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=stopped -->"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --raw-field body="$marker
          OpenCode automation failed before a validated patch was produced. STOP — Eddy/Sophira review required." >/dev/null

  report-no-change:
    needs: [collect, agent]
    if: always() && needs.collect.outputs.run == 'true' && needs.agent.result == 'success' && needs.agent.outputs.changed != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report no-change stop
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ needs.collect.outputs.review_id }}
        run: |
          marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=stopped -->"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --raw-field body="$marker
          OpenCode produced no repository changes for material findings. STOP — Eddy/Sophira review required." >/dev/null

  validate:
    needs: [collect, agent]
    if: needs.agent.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.collect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact patch artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opencode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/patch

      - name: Verify and apply patch
        env:
          PATCH_SHA: ${{ needs.agent.outputs.patch_sha }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/patch/change.patch"
          echo "$PATCH_SHA  $patch" | sha256sum -c -
          git apply --check "$patch"
          git apply --index "$patch"
          git diff --cached --check

      - name: Reject control-plane changes and special file modes
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet --             .github AGENTS.md CLAUDE.md docs/12_pr_review_rubric.md             .claude .opencode opencode.json opencode.jsonc requirements.txt pyproject.toml
          then
            echo 'Automated patch modifies protected control-plane/dependency files.'
            exit 1
          fi
          if git ls-files -s | awk '$1 == "120000" || $1 == "160000" { bad=1 } END { exit bad ? 0 : 1 }'; then
            echo 'Tracked symlink/gitlink present after patch; no trusted validator is configured.'
            exit 1
          fi

      - name: Classify validation requirements
        id: classify
        run: |
          python - <<'PY'
          import os
          import subprocess
          raw = subprocess.check_output(['git','diff','--cached','--name-only','--no-renames','-z'])
          paths = [p.decode('utf-8','surrogateescape') for p in raw.split(b'\0') if p]
          py = False
          bad = []
          protected = {
              'AGENTS.md', 'CLAUDE.md', 'docs/12_pr_review_rubric.md',
              'opencode.json', 'opencode.jsonc', 'requirements.txt', 'pyproject.toml',
          }
          for p in paths:
              if any(ord(ch) < 32 for ch in p): bad.append(p)
              elif p in protected or p.startswith(('.github/', '.claude/', '.opencode/')): bad.append(p)
              elif p.endswith('.md'): pass
              elif p.startswith('docs/') and p.lower().endswith(('.png','.jpg','.jpeg','.webp','.json','.csv','.txt')): pass
              elif p.startswith('docs/'): bad.append(p)
              elif p.endswith(('.py','.json','.toml')): py = True
              else: bad.append(p)
          if bad: raise SystemExit('No trusted validator for: ' + repr(bad))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"needs_python={'true' if py else 'false'}\n")
          PY

      - name: Set up Python 3.11
        if: steps.classify.outputs.needs_python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        if: steps.classify.outputs.needs_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[quant]"
          playwright install --with-deps chromium

      - name: Run Python regression suite
        if: steps.classify.outputs.needs_python == 'true'
        run: pytest

  report-validation-failure:
    needs: [collect, agent, validate]
    if: always() && needs.collect.outputs.run == 'true' && needs.agent.outputs.changed == 'true' && needs.validate.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report validation failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ needs.collect.outputs.review_id }}
        run: |
          marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=stopped -->"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --raw-field body="$marker
          Automated correction failed trusted pre-publication validation. STOP — Eddy/Sophira review required." >/dev/null

  publish:
    needs: [collect, agent, validate]
    if: needs.agent.outputs.changed == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.collect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated patch artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opencode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/patch

      - name: Publish exact validated patch
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TOKEN: ${{ secrets.OPENCODE_PUBLISH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ needs.collect.outputs.review_id }}
          HEAD_REF: ${{ needs.collect.outputs.head_ref }}
          EXPECTED_HEAD: ${{ needs.collect.outputs.head_sha }}
          PATCH_SHA: ${{ needs.agent.outputs.patch_sha }}
          ROUND: ${{ needs.collect.outputs.round }}
        run: |
          set -euo pipefail
          test -n "$PUBLISH_TOKEN" || { echo 'Set dedicated OPENCODE_PUBLISH_TOKEN.'; exit 1; }
          patch="$RUNNER_TEMP/patch/change.patch"
          echo "$PATCH_SHA  $patch" | sha256sum -c -

          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.head.ref' <<<"$meta")" = "$HEAD_REF"
          test "$(jq -r '.head.sha' <<<"$meta")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.repo.full_name' <<<"$meta")" = "$GITHUB_REPOSITORY"

          git config core.hooksPath /dev/null
          git apply --cached --check "$patch"
          git apply --cached "$patch"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgSign false
          git commit --no-verify \
            -m "Automated Codex correction for PR #$PR_NUMBER" \
            -m "Shiori-Automation: opencode-codex-relay" \
            -m "Codex-Review-ID: $REVIEW_ID"
          new_head="$(git rev-parse HEAD)"

          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')" = "$EXPECTED_HEAD"
          git remote set-url --push origin "https://x-access-token:$PUBLISH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_HEAD" origin "HEAD:refs/heads/$HEAD_REF"
          remote_head="$(git ls-remote "https://x-access-token:$PUBLISH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/heads/$HEAD_REF" | awk '{print $1}')"
          test "$remote_head" = "$new_head"

          marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=completed from=$EXPECTED_HEAD to=$new_head -->"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --raw-field body="$marker
