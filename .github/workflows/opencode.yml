name: OpenCode PR command

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    outputs:
      run: ${{ steps.command.outputs.run }}
      prompt_b64: ${{ steps.command.outputs.prompt_b64 }}

    steps:
      - name: Authorize exact slash command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          python - <<'PY'
          import base64
          import os
          import re

          body = os.environ["COMMENT_BODY"].strip()
          allowed = os.environ["AUTHOR_ASSOCIATION"] == "OWNER"
          match = re.fullmatch(r"/(?:oc|opencode)(?:\s+([\s\S]*))?", body, re.IGNORECASE)

          run = bool(allowed and match)
          prompt = ""
          if run:
              prompt = (match.group(1) or "").strip()
              if not prompt:
                  prompt = "Inspect this PR and address the latest unresolved material review findings. Follow AGENTS.md."

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={'true' if run else 'false'}\n")
              if run:
                  encoded = base64.b64encode(prompt.encode()).decode()
                  out.write(f"prompt_b64={encoded}\n")
          PY

  writer:
    needs: authorize
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    concurrency:
      group: shiori-opencode-pr-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Restore authorized prompt
        env:
          PROMPT_B64: ${{ needs.authorize.outputs.prompt_b64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          import pathlib

          prompt = base64.b64decode(os.environ["PROMPT_B64"]).decode()
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "opencode-prompt.txt"
          path.write_text(
              prompt
              + "\n\n"
              + "Security boundary: read/search/edit repository files only. "
                "Do not run validation, shell commands, network tools, subagents, "
                "formatters, LSP, or external-directory tools; those capabilities "
                "are hard-disabled. The workflow owns commit/push. Validation runs "
                "separately without model credentials.\n",
              encoding="utf-8",
          )
          PY

      - name: Resolve current PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$meta")"
          test "$head_repo" = "$GITHUB_REPOSITORY" || {
            echo "Refusing write automation on a fork PR."
            exit 1
          }
          echo "head_ref=$(jq -r '.head.ref' <<<"$meta")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<"$meta")" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare verified PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          test "$current_sha" = "$HEAD_SHA"
          test "$current_ref" = "$HEAD_REF"
          git fetch origin "$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse "refs/remotes/origin/$HEAD_REF")" = "$HEAD_SHA"
          git switch -C "$HEAD_REF" "$HEAD_SHA"
          git branch --set-upstream-to="origin/$HEAD_REF" "$HEAD_REF"
          git remote set-url --push origin DISABLED_BY_SHIORI_WORKFLOW

      - name: Install pinned OpenCode CLI
        env:
          OPENCODE_VERSION: v1.18.33
          OPENCODE_SHA256: e546123213ae47909a4268692aa4b94950d011afe9cac9938753a2194f1c16d5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          bindir="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bindir"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/$OPENCODE_VERSION/opencode-linux-x64.tar.gz" -o "$archive"
          echo "$OPENCODE_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bindir"
          test -x "$bindir/opencode"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Run OpenCode
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_AUTOMATION_MODEL }}
          OPENCODE_VARIANT: ${{ vars.OPENCODE_AUTOMATION_VARIANT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENCODE_AUTOMATION_API_KEY }}
          OPENCODE_CONFIG_CONTENT: '{"formatter":false,"permission":{"*":"deny","read":"allow","edit":"allow","glob":"allow","grep":"allow"},"provider":{"openrouter":{"options":{"apiKey":"{env:OPENROUTER_API_KEY}"}}}}'
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$OPENCODE_MODEL" || {
            echo "Set repository Actions variable OPENCODE_AUTOMATION_MODEL."
            exit 1
          }
          test -n "$OPENROUTER_API_KEY" || {
            echo "Set dedicated repository secret OPENCODE_AUTOMATION_API_KEY."
            exit 1
          }
          case "$OPENCODE_MODEL" in
            openrouter/*) ;;
            *) echo "OPENCODE_AUTOMATION_MODEL must use the openrouter/* provider."; exit 1 ;;
          esac

          args=(run --auto --model "$OPENCODE_MODEL")
          if [ -n "${OPENCODE_VARIANT:-}" ]; then
            args+=(--variant "$OPENCODE_VARIANT")
          fi

          opencode --pure "${args[@]}" < "$RUNNER_TEMP/opencode-prompt.txt"

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || {
            echo "OpenCode committed locally even though the workflow owns commit/push. STOP."
            exit 1
          }

      - name: Validate correction before publication
        env:
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail

          changed="$(
            {
              git diff --name-only "$EXPECTED_HEAD" --
              git ls-files --others --exclude-standard
            } | sed '/^$/d' | sort -u
          )"

          if [ -z "$changed" ]; then
            echo "No repository changes to validate."
            exit 0
          fi

          printf '%s\n' "$changed"

          needs_python=false
          needs_actionlint=false
          unsupported=""

          while IFS= read -r path; do
            case "$path" in
              *.md|docs/*)
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                needs_actionlint=true
                ;;
              *.py|*.html|*.css|*.js|*.ts|*.tsx|*.json|*.toml|requirements.txt|pyproject.toml|src/*|tests/*)
                needs_python=true
                ;;
              *)
                unsupported="${unsupported}${unsupported:+$'\n'}$path"
                ;;
            esac
          done <<< "$changed"

          if [ -n "$unsupported" ]; then
            echo "No trusted pre-publication validator is configured for:"
            printf '%s\n' "$unsupported"
            echo "STOP — Eddy/Sophira review required before publication."
            exit 1
          fi

          if [ "$needs_actionlint" = true ]; then
            archive="$RUNNER_TEMP/actionlint.tar.gz"
            bindir="$RUNNER_TEMP/actionlint-bin"
            mkdir -p "$bindir"
            curl -fsSL "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/actionlint_1.7.12_linux_amd64.tar.gz" -o "$archive"
            echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$bindir"
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
              | xargs -0 -r "$bindir/actionlint"
          fi

          if [ "$needs_python" = true ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install -e ".[quant]"
            playwright install --with-deps chromium
            pytest
          fi

      - name: Commit and push verified changes
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          test "$current_sha" = "$EXPECTED_HEAD"
          test "$current_ref" = "$HEAD_REF"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "OpenCode: amend PR #$PR_NUMBER"
          new_head="$(git rev-parse HEAD)"

          git remote set-url --push origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "HEAD:$HEAD_REF"

          remote_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$remote_head" = "$new_head"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.publish.outputs.changed }}
          NEW_HEAD: ${{ steps.publish.outputs.new_head }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" = "true" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="OpenCode manual command completed. New HEAD: $NEW_HEAD." >/dev/null
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="@codex review" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="OpenCode manual command completed with no repository changes." >/dev/null
          fi
