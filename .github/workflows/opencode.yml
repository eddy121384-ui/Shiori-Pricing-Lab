name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Task prompt
        required: true
        type: string
      pr_number:
        description: Existing PR number when modifying a PR
        required: true
        type: string
      head_ref:
        description: Expected PR head branch
        required: true
        type: string
      head_sha:
        description: Expected PR head SHA
        required: true
        type: string
      review_id:
        description: Source review ID for relay/audit
        required: false
        type: string
      fingerprints:
        description: Material finding fingerprints for completed-round accounting
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: opencode-${{ github.repository }}-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest

    steps:
      - name: Require configured model
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          test -n "$OPENCODE_MODEL" || {
            echo "Set repository Actions variable OPENCODE_MODEL to provider/model."
            exit 1
          }

      - name: Verify dispatched PR HEAD
        id: guard
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          if [ "$current_sha" = "$EXPECTED_HEAD" ] && { [ -z "$EXPECTED_REF" ] || [ "$current_ref" = "$EXPECTED_REF" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Stale dispatch: expected $EXPECTED_REF@$EXPECTED_HEAD, current PR head is $current_ref@$current_sha."
          fi

      - name: Checkout verified dispatched SHA
        if: github.event_name == 'workflow_dispatch' && steps.guard.outputs.run == 'true' && inputs.head_ref != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare verified PR branch
        if: github.event_name == 'workflow_dispatch' && steps.guard.outputs.run == 'true' && inputs.head_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          test "$current_sha" = "$HEAD_SHA"
          test "$current_ref" = "$HEAD_REF"
          git fetch origin "$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse "refs/remotes/origin/$HEAD_REF")" = "$HEAD_SHA"
          git switch -C "$HEAD_REF" "$HEAD_SHA"
          git branch --set-upstream-to="origin/$HEAD_REF" "$HEAD_REF"

      - name: Checkout event context
        if: github.event_name != 'workflow_dispatch' || inputs.head_ref == ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode from comment
        if: github.event_name != 'workflow_dispatch'
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PROVIDER_API_KEY: ${{ secrets.OPENCODE_PROVIDER_API_KEY }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          variant: ${{ vars.OPENCODE_VARIANT }}
          use_github_token: true
          share: false

      - name: Run OpenCode from dispatched prompt
        if: github.event_name == 'workflow_dispatch' && steps.guard.outputs.run == 'true' && inputs.head_ref != ''
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PROVIDER_API_KEY: ${{ secrets.OPENCODE_PROVIDER_API_KEY }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          variant: ${{ vars.OPENCODE_VARIANT }}
          prompt: ${{ inputs.prompt }}
          use_github_token: true
          share: false

      - name: Record completed correction
        if: github.event_name == 'workflow_dispatch' && success() && steps.guard.outputs.run == 'true' && inputs.review_id != '' && inputs.fingerprints != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_ID: ${{ inputs.review_id }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          EXPECTED_REF: ${{ inputs.head_ref }}
          FINGERPRINTS: ${{ inputs.fingerprints }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"

          if [ "$current_ref" != "$EXPECTED_REF" ] || [ "$current_sha" = "$EXPECTED_HEAD" ]; then
            echo "No verified new PR HEAD; correction round is not counted."
            exit 0
          fi

          marker="<!-- codex-opencode-relay:review=$REVIEW_ID status=completed from=$EXPECTED_HEAD to=$current_sha fingerprints=$FINGERPRINTS -->"
          body="$marker
          OpenCode correction completed for PR #$PR_NUMBER: HEAD advanced from $EXPECTED_HEAD to $current_sha."
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
