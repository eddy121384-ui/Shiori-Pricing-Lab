name: OpenCode PR command

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: ${{ github.event.issue.pull_request != null && github.event.comment.author_association == 'OWNER' && (github.event.comment.body == '/oc' || startsWith(github.event.comment.body, '/oc ') || github.event.comment.body == '/opencode' || startsWith(github.event.comment.body, '/opencode ')) && format('shiori-opencode-pr-{0}', github.event.issue.number) || format('shiori-opencode-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.command.outputs.run }}
      prompt_b64: ${{ steps.command.outputs.prompt_b64 }}

    steps:
      - name: Authorize exact owner slash command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          python - <<'PY'
          import base64
          import os
          import re

          body = os.environ["COMMENT_BODY"]
          allowed = os.environ["AUTHOR_ASSOCIATION"] == "OWNER"
          match = re.fullmatch(r"/(?:oc|opencode)(?:\s+([\s\S]+))?", body)
          prompt = ((match.group(1) or "").strip() if match else "")
          run = bool(allowed and match and prompt)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={'true' if run else 'false'}\n")
              if run:
                  out.write("prompt_b64=" + base64.b64encode(prompt.encode()).decode() + "\n")
          PY

  agent:
    needs: authorize
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      patch_sha: ${{ steps.patch.outputs.patch_sha }}
      changed: ${{ steps.patch.outputs.changed }}

    steps:
      - name: Resolve same-repository PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.head.repo.full_name' <<<"$meta")" = "$GITHUB_REPOSITORY"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --slurp > "$RUNNER_TEMP/pr-files.json"
          python - <<'PY'
          import json
          import os
          import pathlib

          pages = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr-files.json").read_text())
          files = []
          for page in pages:
              for item in page:
                  files.append(item["filename"])
                  if item.get("previous_filename"):
                      files.append(item["previous_filename"])
          protected_basenames = {
              "AGENTS.md", "CLAUDE.md", "opencode.json", "opencode.jsonc",
              "requirements.txt", "pyproject.toml",
          }
          def is_protected(path: str) -> bool:
              parts = path.split("/")
              return (
                  path == "docs/12_pr_review_rubric.md"
                  or parts[-1] in protected_basenames
                  or ".github" in parts
                  or ".claude" in parts
                  or ".opencode" in parts
              )
          protected = [path for path in files if is_protected(path)]
          if protected:
              raise SystemExit("Automation is disabled for PRs that modify control-plane files: " + repr(protected))
          PY
          resolved_ref="$(jq -r '.head.ref' <<<"$meta")"
          resolved_sha="$(jq -r '.head.sha' <<<"$meta")"
          fresh="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.head.ref' <<<"$fresh")" = "$resolved_ref"
          test "$(jq -r '.head.sha' <<<"$fresh")" = "$resolved_sha"
          echo "head_ref=$resolved_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore authorized prompt
        env:
          PROMPT_B64: ${{ needs.authorize.outputs.prompt_b64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          import pathlib

          prompt = base64.b64decode(os.environ["PROMPT_B64"]).decode()
          text = prompt + "\n\n" + (
              "Security boundary: read/search/edit repository files only. "
              "Do not run validation, shell commands, network tools, subagents, "
              "formatters, LSP, or external-directory tools. The workflow owns "
              "commit/push and validation. Do not edit .git metadata or repository control-plane files "
              "(.github/**, AGENTS.md, CLAUDE.md, docs/12_pr_review_rubric.md, .claude/**, "
              "opencode.json/jsonc, .opencode/**, requirements.txt, or pyproject.toml)."
          )
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "opencode-prompt.txt").write_text(text, encoding="utf-8")
          PY

      - name: Install pinned OpenCode CLI
        env:
          OPENCODE_VERSION: v1.18.33
          OPENCODE_SHA256: e546123213ae47909a4268692aa4b94950d011afe9cac9938753a2194f1c16d5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          bindir="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bindir"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/$OPENCODE_VERSION/opencode-linux-x64.tar.gz" -o "$archive"
          echo "$OPENCODE_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bindir"
          test -x "$bindir/opencode"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Quarantine PR-controlled OpenCode config
        run: |
          set -euo pipefail
          q="$RUNNER_TEMP/opencode-quarantine"
          mkdir -p "$q"
          for path in opencode.json opencode.jsonc .opencode; do
            if [ -e "$path" ]; then
              mv "$path" "$q/$path"
            fi
          done

      - name: Reconfirm head and reject symlink or gitlink before model
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.head.sha' <<<"$meta")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.ref' <<<"$meta")" = "$EXPECTED_REF"
          test "$(jq -r '.head.repo.full_name' <<<"$meta")" = "$GITHUB_REPOSITORY"
          if git ls-files -s | awk '$1 == "120000" || $1 == "160000" { bad=1 } END { exit bad ? 0 : 1 }'; then
            echo 'Tracked symlink/gitlink present; automation fails closed.'
            exit 1
          fi

      - name: Run read-edit-only OpenCode
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_AUTOMATION_MODEL }}
          OPENCODE_VARIANT: ${{ vars.OPENCODE_AUTOMATION_VARIANT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENCODE_AUTOMATION_API_KEY }}
          OPENCODE_CONFIG_CONTENT: '{"formatter":false,"lsp":false,"plugin":[],"permission":{"*":"deny","read":{"*":"allow",".git/*":"deny","*.env":"deny","*.env.*":"deny"},"edit":{"*":"allow",".git/*":"deny"},"glob":"allow","grep":"allow"},"agent":{"build":{"permission":{"*":"deny","read":{"*":"allow",".git/*":"deny","*.env":"deny","*.env.*":"deny"},"edit":{"*":"allow",".git/*":"deny"},"glob":"allow","grep":"allow"}}}}'
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_DISABLE_CLAUDE_CODE: "1"
          OPENCODE_PURE: "1"
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$OPENCODE_MODEL"
          test -n "$OPENROUTER_API_KEY"
          case "$OPENCODE_MODEL" in
            openrouter/*) ;;
            *) echo "OPENCODE_AUTOMATION_MODEL must use openrouter/*."; exit 1 ;;
          esac
          args=(run --auto --agent build --model "$OPENCODE_MODEL")
          if [ -n "${OPENCODE_VARIANT:-}" ]; then
            args+=(--variant "$OPENCODE_VARIANT")
          fi
          opencode --pure "${args[@]}" < "$RUNNER_TEMP/opencode-prompt.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Restore quarantined OpenCode config
        if: always()
        run: |
          set -euo pipefail
          q="$RUNNER_TEMP/opencode-quarantine"
          collision=false
          for path in opencode.json opencode.jsonc .opencode; do
            if [ -e "$q/$path" ]; then
              if [ -e "$path" ]; then
                rm -rf "$path"
                collision=true
              fi
              mv "$q/$path" "$path"
            fi
          done
          if [ "$collision" = true ]; then
            echo 'OpenCode attempted to create project-level OpenCode config while trusted config was quarantined.'
            exit 1
          fi

      - name: Build immutable patch
        id: patch
        run: |
          set -euo pipefail
          git add -A
          patch="$RUNNER_TEMP/change.patch"
          git diff --cached --binary --full-index --no-ext-diff > "$patch"
          if [ ! -s "$patch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(sha256sum "$patch" | awk '{print $1}')"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "patch_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload immutable patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opencode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/change.patch
          if-no-files-found: error
          retention-days: 1

  report-agent-failure:
    needs: [authorize, agent]
    if: always() && needs.authorize.outputs.run == 'true' && needs.agent.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report agent failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body='OpenCode manual automation failed before a validated patch was produced. STOP — inspect the workflow run and return to Eddy/Sophira.' >/dev/null

  report-no-change:
    needs: [authorize, agent]
    if: always() && needs.authorize.outputs.run == 'true' && needs.agent.result == 'success' && needs.agent.outputs.changed != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report no-change stop
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body='OpenCode manual command produced no repository changes. STOP — Eddy/Sophira review required.' >/dev/null

  validate:
    needs: agent
    if: needs.agent.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.agent.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact patch artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opencode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/patch

      - name: Verify and apply patch
        env:
          PATCH_SHA: ${{ needs.agent.outputs.patch_sha }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/patch/change.patch"
          echo "$PATCH_SHA  $patch" | sha256sum -c -
          git apply --check "$patch"
          git apply --index "$patch"
          git diff --cached --check

      - name: Reject control-plane changes and special file modes
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet --             .github AGENTS.md CLAUDE.md docs/12_pr_review_rubric.md             .claude .opencode opencode.json opencode.jsonc requirements.txt pyproject.toml
          then
            echo 'Automated patch modifies protected control-plane/dependency files.'
            exit 1
          fi
          if git ls-files -s | awk '$1 == "120000" || $1 == "160000" { bad=1 } END { exit bad ? 0 : 1 }'; then
            echo 'Tracked symlink/gitlink present after patch; no trusted validator is configured.'
            exit 1
          fi

          if git diff --cached --summary | grep -q 'mode change'; then
            echo 'Automated patch changes executable/file mode; no trusted validator is configured.'
            exit 1
          fi

      - name: Classify validation requirements
        id: classify
        run: |
          python - <<'PY'
          import os
          import subprocess

          raw = subprocess.check_output(["git", "diff", "--cached", "--name-only", "--no-renames", "-z"])
          paths = [p.decode("utf-8", "surrogateescape") for p in raw.split(b"\0") if p]
          needs_python = False
          unsupported = []
          protected_basenames = {
              "AGENTS.md", "CLAUDE.md", "opencode.json", "opencode.jsonc",
              "requirements.txt", "pyproject.toml",
          }
          def is_protected(path: str) -> bool:
              parts = path.split("/")
              return (
                  path == "docs/12_pr_review_rubric.md"
                  or parts[-1] in protected_basenames
                  or ".github" in parts
                  or ".claude" in parts
                  or ".opencode" in parts
              )
          for path in paths:
              if any(ord(ch) < 32 for ch in path):
                  unsupported.append(path)
              elif is_protected(path):
                  unsupported.append(path)
              elif path.endswith(".md"):
                  pass
              elif path.startswith("docs/") and path.lower().endswith((".png", ".jpg", ".jpeg", ".webp", ".json", ".csv", ".txt")):
                  pass
              elif path.startswith("docs/"):
                  unsupported.append(path)
              elif path.endswith((".py", ".json", ".toml")):
                  needs_python = True
              else:
                  unsupported.append(path)
          if unsupported:
              raise SystemExit("No trusted validator for: " + repr(unsupported))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"needs_python={'true' if needs_python else 'false'}\n")
          PY

      - name: Set up Python 3.11
        if: steps.classify.outputs.needs_python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        if: steps.classify.outputs.needs_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[quant]"
          playwright install --with-deps chromium

      - name: Run Python regression suite
        if: steps.classify.outputs.needs_python == 'true'
        run: pytest

      - name: Verify validated patch remained exact
        env:
          PATCH_SHA: ${{ needs.agent.outputs.patch_sha }}
        run: |
          set -euo pipefail
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          verified="$RUNNER_TEMP/validated.patch"
          git diff --cached --binary --full-index --no-ext-diff > "$verified"
          echo "$PATCH_SHA  $verified" | sha256sum -c -

  report-validation-failure:
    needs: [authorize, agent, validate]
    if: always() && needs.authorize.outputs.run == 'true' && needs.agent.outputs.changed == 'true' && needs.validate.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report validation failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body='OpenCode changes failed trusted pre-publication validation. STOP — Eddy/Sophira review required.' >/dev/null

  publish:
    needs: [agent, validate]
    if: needs.agent.outputs.changed == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.agent.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated patch artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: opencode-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/patch

      - name: Publish exact validated patch
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TOKEN: ${{ secrets.OPENCODE_PUBLISH_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ needs.agent.outputs.head_ref }}
          EXPECTED_HEAD: ${{ needs.agent.outputs.head_sha }}
          PATCH_SHA: ${{ needs.agent.outputs.patch_sha }}
        run: |
          set -euo pipefail
          test -n "$PUBLISH_TOKEN" || { echo 'Set dedicated OPENCODE_PUBLISH_TOKEN.'; exit 1; }
          patch="$RUNNER_TEMP/patch/change.patch"
          echo "$PATCH_SHA  $patch" | sha256sum -c -

          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.head.ref' <<<"$meta")" = "$HEAD_REF"
          test "$(jq -r '.head.sha' <<<"$meta")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.repo.full_name' <<<"$meta")" = "$GITHUB_REPOSITORY"

          git config core.hooksPath /dev/null
          git apply --cached --check "$patch"
          git apply --cached "$patch"
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgSign false
          git commit --no-verify -m "OpenCode: amend PR #$PR_NUMBER"
          new_head="$(git rev-parse HEAD)"

          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$meta")" = "open"
          test "$(jq -r '.merged_at // ""' <<<"$meta")" = ""
          test "$(jq -r '.head.repo.full_name' <<<"$meta")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.ref' <<<"$meta")" = "$HEAD_REF"
          test "$(jq -r '.head.sha' <<<"$meta")" = "$EXPECTED_HEAD"
          git remote set-url --push origin "https://x-access-token:$PUBLISH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          remote_head="$(git ls-remote "https://x-access-token:$PUBLISH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/heads/$HEAD_REF" | awk '{print $1}')"
          test "$remote_head" = "$new_head"

          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="OpenCode manual command completed. New HEAD: $new_head. Awaiting configured automatic Codex review for the new push." >/dev/null
