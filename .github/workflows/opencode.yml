name: OpenCode PR command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: shiori-opencode-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest

    steps:
      - name: Authorize exact slash command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          body = os.environ["COMMENT_BODY"].strip()
          allowed = os.environ["AUTHOR_ASSOCIATION"] in {"OWNER", "MEMBER", "COLLABORATOR"}
          match = re.fullmatch(r"/(?:oc|opencode)(?:[ \t]+([\s\S]*))?", body, re.IGNORECASE)

          run = bool(allowed and match)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={'true' if run else 'false'}\n")

          if not run:
              raise SystemExit(0)

          prompt = (match.group(1) or "").strip()
          if not prompt:
              prompt = "Inspect this PR and address the latest unresolved material review findings. Follow AGENTS.md."

          pathlib.Path(os.environ["RUNNER_TEMP_DIR"], "opencode-prompt.txt").write_text(prompt, encoding="utf-8")
          PY

      - name: Resolve current PR head
        id: pr
        if: steps.command.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$meta")"
          test "$head_repo" = "$GITHUB_REPOSITORY" || {
            echo "Refusing write automation on a fork PR."
            exit 1
          }
          echo "head_ref=$(jq -r '.head.ref' <<<"$meta")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<"$meta")" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head
        if: steps.command.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare verified PR branch
        if: steps.command.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          test "$current_sha" = "$HEAD_SHA"
          test "$current_ref" = "$HEAD_REF"
          git fetch origin "$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse "refs/remotes/origin/$HEAD_REF")" = "$HEAD_SHA"
          git switch -C "$HEAD_REF" "$HEAD_SHA"
          git branch --set-upstream-to="origin/$HEAD_REF" "$HEAD_REF"
          git remote set-url --push origin DISABLED_BY_SHIORI_WORKFLOW

      - name: Install pinned OpenCode CLI
        if: steps.command.outputs.run == 'true'
        env:
          OPENCODE_VERSION: v1.18.33
          OPENCODE_SHA256: e546123213ae47909a4268692aa4b94950d011afe9cac9938753a2194f1c16d5
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          bindir="$RUNNER_TEMP/opencode-bin"
          mkdir -p "$bindir"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/$OPENCODE_VERSION/opencode-linux-x64.tar.gz" -o "$archive"
          echo "$OPENCODE_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$bindir"
          test -x "$bindir/opencode"
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Run OpenCode
        if: steps.command.outputs.run == 'true'
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_VARIANT: ${{ vars.OPENCODE_VARIANT }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PROVIDER_API_KEY: ${{ secrets.OPENCODE_PROVIDER_API_KEY }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$OPENCODE_MODEL" || {
            echo "Set repository Actions variable OPENCODE_MODEL to provider/model."
            exit 1
          }

          args=(run --auto --model "$OPENCODE_MODEL")
          if [ -n "${OPENCODE_VARIANT:-}" ]; then
            args+=(--variant "$OPENCODE_VARIANT")
          fi

          opencode "${args[@]}" < "$RUNNER_TEMP/opencode-prompt.txt"

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" || {
            echo "OpenCode committed locally even though the workflow owns commit/push. STOP."
            exit 1
          }

      - name: Commit and push verified changes
        id: publish
        if: steps.command.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')"
          test "$current_sha" = "$EXPECTED_HEAD"
          test "$current_ref" = "$HEAD_REF"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "OpenCode: amend PR #$PR_NUMBER"
          new_head="$(git rev-parse HEAD)"

          git remote set-url --push origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin "HEAD:$HEAD_REF"

          remote_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$remote_head" = "$new_head"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "new_head=$new_head" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: steps.command.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.publish.outputs.changed }}
          NEW_HEAD: ${{ steps.publish.outputs.new_head }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" = "true" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="OpenCode manual command completed. New HEAD: `$NEW_HEAD`." >/dev/null
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="@codex review" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="OpenCode manual command completed with no repository changes." >/dev/null
          fi
