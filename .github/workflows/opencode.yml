name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Task prompt
        required: true
        type: string
      pr_number:
        description: Existing PR number when modifying a PR
        required: false
        type: string
      head_ref:
        description: Expected PR head branch
        required: false
        type: string
      head_sha:
        description: Expected PR head SHA
        required: false
        type: string
      review_id:
        description: Source review ID for relay/audit
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: opencode-${{ github.repository }}-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest

    steps:
      - name: Require configured model
        env:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: |
          test -n "$OPENCODE_MODEL" || {
            echo "Set repository Actions variable OPENCODE_MODEL to provider/model."
            exit 1
          }

      - name: Verify dispatched PR HEAD
        id: guard
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current" = "$EXPECTED_HEAD" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Stale dispatch: expected $EXPECTED_HEAD, current PR HEAD is $current."
          fi

      - name: Checkout dispatched PR head
        if: github.event_name == 'workflow_dispatch' && (steps.guard.outputs.run == 'true' || inputs.head_sha == '') && inputs.head_ref != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout event context
        if: github.event_name != 'workflow_dispatch' || inputs.head_ref == ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode from comment
        if: github.event_name != 'workflow_dispatch'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PROVIDER_API_KEY: ${{ secrets.OPENCODE_PROVIDER_API_KEY }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          variant: ${{ vars.OPENCODE_VARIANT }}
          use_github_token: true
          share: false

      - name: Run OpenCode from dispatched prompt
        if: github.event_name == 'workflow_dispatch' && (steps.guard.outputs.run == 'true' || inputs.head_sha == '')
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_PROVIDER_API_KEY: ${{ secrets.OPENCODE_PROVIDER_API_KEY }}
          OPENCODE_CONFIG_CONTENT: ${{ secrets.OPENCODE_CONFIG_CONTENT }}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          variant: ${{ vars.OPENCODE_VARIANT }}
          prompt: ${{ inputs.prompt }}
          use_github_token: true
          share: false
