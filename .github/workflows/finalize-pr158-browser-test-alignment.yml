name: Finalize PR 158 browser test alignment

on:
  push:
    branches:
      - "claude/ust-bloomberg-auto-fields-ljkqsk"

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "claude/ust-bloomberg-auto-fields-ljkqsk"
          fetch-depth: 0

      - name: Correct the remaining stale assertion
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          target = Path('tests/test_standalone_option_workbench_prototype_browser.py')
          source = target.read_text(encoding="utf-8")
          tree = ast.parse(source)
          node = next(
              node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "test_an_irregular_schedule_never_suggests_a_last_coupon_date_fix"
          )
          start = min([node.lineno, *[decorator.lineno for decorator in node.decorator_list]]) - 1
          end = node.end_lineno
          lines = source.splitlines(keepends=True)
          lines[start:end] = ['@_PLAYWRIGHT_SKIP\n@_QUANTLIB_SKIP\ndef test_an_irregular_schedule_never_suggests_a_last_coupon_date_fix(\n    server_url, page\n) -> None:\n    """The refusal is visible before manual entry, and manual completion\n    cannot bypass it afterward."""\n\n    page.goto(f"{server_url}/")\n    _load_bloomberg_bond(\n        page,\n        response=_treasury_lookup_response(\n            bond_master={**_TREASURY_BOND_MASTER, "issue_date": "2024-03-05"}\n        ),\n    )\n    _wait_for_ust_profile(page)\n\n    profile = _ust_profile(page)\n    assert profile["supported"] is False\n    assert profile["fields"] == []\n    assert profile["unresolved_fields"] == []\n\n    page.click("#advanced-head")\n    status_before = page.inner_text("#ust-profile-status").lower()\n    assert "unsupported by the current pricing path" in status_before\n    assert "editing last_coupon_date cannot repair" in status_before\n    assert "changing advanced fields cannot make this ticket price" in status_before\n    assert "manually fill last_coupon_date" not in status_before\n\n    _fill_trade_group(page)\n    _fill_market_review(page)\n    _fill_advanced_overrides(page)\n    page.wait_for_timeout(250)\n\n    assert _is_disabled(page, "#price-btn")\n    assert _is_disabled(page, "#bloomberg-refresh-btn")\n    assert page.evaluate("() => window.__shioriTestBuilderValidationState()") == "unknown"\n\n    page.click("#advanced-head")\n    status_after = page.inner_text("#ust-profile-status").lower()\n    assert "changing advanced fields cannot make this ticket price" in status_after\n    assert "manually fill last_coupon_date" not in status_after\n']
          updated = "".join(lines)
          ast.parse(updated)
          target.write_text(updated, encoding="utf-8")
          PY
          python -m pip install --quiet ruff==0.16.1
          python -m py_compile tests/test_standalone_option_workbench_prototype_browser.py
          ruff check tests/test_standalone_option_workbench_prototype_browser.py
          git diff --check

      - name: Commit only the final browser-test alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-pr158-browser-test-alignment.yml
          git add tests/test_standalone_option_workbench_prototype_browser.py
          git diff --cached --check
          git commit -m "tests: finalize unsupported-profile browser coverage"
          git push origin HEAD:"claude/ust-bloomberg-auto-fields-ljkqsk"
