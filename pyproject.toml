[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-pricing-lab"
version = "0.1.0"
description = "AI-native pricing and rates analytics lab for trader-owned workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Eddy" }
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "plotly>=5.20",
  "streamlit>=1.35",
]

[project.optional-dependencies]
# Issue #181's VCUB visual capture. Deliberately optional, not a core
# requirement: it is the only part of the repository that needs an OCR
# reader, and the ordinary start_shiori.bat install should stay as light as
# it is today. rapidocr-onnxruntime is pip-only on Windows -- no system
# installer, no administrator rights, no PATH entry, no GPU. Without this
# extra the Capture view reports the missing reader and captures nothing;
# every structural test in the slice still runs.
capture = [
  "rapidocr-onnxruntime>=1.3",
  "pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "playwright>=1.40",
]
quant = [
  "QuantLib>=1.32",
]
storage = [
  "duckdb>=1.0",
  "pyarrow>=15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
